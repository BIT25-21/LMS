        <!-- ================================
     ADD EMPLOYEE FORM (UPDATED)
================================ -->
<form id="add-employee-form">

    <h3>Employee Details</h3>

    <label>Full Name</label>
    <input type="text" id="emp-name" required>

    <label>Email</label>
    <input type="email" id="emp-email" required>

    <label>Password</label>
    <input type="password" id="emp-password" required>

    <label>Department</label>
    <input type="text" id="emp-dept" required>

    <label>Role</label>
    <select id="emp-role">
        <option value="employee">Employee</option>
        <option value="manager">Manager</option>
        <option value="hr">HR</option>
        <option value="admin">Admin</option>
    </select>

    <hr>

    <h3>Leave Entitlements</h3>

    <label>Annual Leave (Days)</label>
    <input type="number" id="annual-leave" value="21">

    <label>Sick Leave (Days)</label>
    <input type="number" id="sick-leave" value="14">

    <label>Maternity Leave (Days)</label>
    <input type="number" id="maternity-leave" value="60">

    <button type="submit">Create Employee</button>

</form>


        <section class="card">
    <h3>Reset Employee Password</h3>

    <input type="email" id="reset-email" placeholder="Employee email">
    <input type="password" id="new-password" placeholder="New password">

    <button onclick="resetPassword()">Reset Password</button>
</section>

  <!-- ==================================================
     EMPLOYEE TABLE
================================================== -->
<section class="card">

    <h3>Employee List</h3>

    <!-- Loading state -->
    <div id="employees-loading" style="display:none;">
        Loading employees...
    </div>

    <!-- Error state -->
    <div id="employees-error" style="display:none; color:red;"></div>

    <!-- Empty state -->
    <div id="employees-empty" style="display:none;">
        No employees found.
    </div>

    <!-- Table container -->
    <div id="employees-table">
        <!-- dynamic content -->
    </div>

</section>

    </main>
