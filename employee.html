<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="app-nav"></div>

    <div class="container">
        <h2>Employee Management</h2>
        <div style="margin-bottom: 24px; padding: 20px; background: rgba(245, 246, 255, 0.8); border-radius: 16px;">
            <h3>Add New Employee</h3>
            <form id="add-employee-form" onsubmit="addEmployee(event)">
                <label for="emp-name">Name</label>
                <input type="text" id="emp-name" required>
                <label for="emp-email">Email</label>
                <input type="email" id="emp-email" required>
                <label for="emp-dept">Department</label>
                <input type="text" id="emp-dept" placeholder="e.g., Engineering" required>
                <button type="submit">Add Employee</button>
            </form>
        </div>
        <div id="employees-table"></div>
    </div>
</body>
</html>
