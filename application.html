<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Title</title>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- 1. Supabase SDK (ONLY ONCE) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Global Supabase client -->
    <script src="js/config.js"></script>

    <!-- 3. Page logic -->
    <script src="js/application.js" defer></script>

    <!-- 4. Optional auth (logout, session checks) -->
    <script src="js/auth.js" defer></script>

</head>

<body>

    <!-- SIDE NAV (if needed) -->
    <aside class="side-nav" id="sideNav">
        <div class="brand">Leaveable</div>

        <nav>
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="application.html" class="nav-item active">Apply Leave</a>
            <a href="approval.html" class="nav-item">Approvals</a>
            <a href="employee.html" class="nav-item">Employees</a>
            <a href="schedule.html" class="nav-item">Schedule</a>
            <a href="tasks.html" class="nav-item ">Tasks</a>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </nav>
    </aside>

    <main class="container">
        <header class="page-header">
            <h2>Leave Application</h2>
        </header>
        <form id="leave-request-form" onsubmit="submitLeave(event)">
            <label for="leave-emp">Employee</label>
            <select id="leave-emp" required>
                <option value="">Select an employee</option>
            </select>
            <label for="leave-type">Leave Type</label>
            <select id="leave-type" required>
                <option value="">Select leave type</option>
                <option value="Annual">Annual Leave</option>
                <option value="Sick">Sick Leave</option>
                <option value="Personal">Personal Leave</option>
                <option value="Maternity">Maternity Leave</option>
            </select>
            <label for="start-date">Start Date</label>
            <input type="date" id="start-date" required>
            <label for="end-date">End Date</label>
            <input type="date" id="end-date" required>
            <label for="leave-reason">Reason</label>
            <textarea id="leave-reason" required></textarea>
            <button type="submit">Submit Leave Request</button>
        </form>
    </main>
</body>
</html>
