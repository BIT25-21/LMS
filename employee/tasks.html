<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Management</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Config -->
    <script src="../js/config.js"></script>

    <!-- Shared helpers (escaping, working-day maths) -->
    <script src="../js/utils.js" defer></script>

    <!-- Leave rules engine (balance, overlap, holidays) -->
    <script src="../js/leave-rules.js" defer></script>

    <!-- Role guard (RBAC) - must run before page logic -->
    <script src="../js/guard.js" defer></script>

    <!-- Auth -->
    <script src="../js/auth.js" defer></script>

    <!-- Notifications (bell, realtime, approve/reject modal) -->
    <script src="../js/notifications.js" defer></script>

    <!-- TASK MODULE (IMPORTANT FIX) -->
    <script src="../js/tasks.js" defer></script>
</head>

<body>

    <!-- SIDE NAV -->
    <aside class="side-nav" id="sideNav">
        <div class="brand">Leaveable</div>

        <nav>
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="application.html" class="nav-item">Apply Leave</a>
            <a href="employee.html" class="nav-item">Employees</a>
            <a href="schedule.html" class="nav-item">Schedule</a>
            <a href="tasks.html" class="nav-item active">Tasks</a>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="container">

        <h2>Task Management</h2>

        <!-- ===================== TASK FORM ===================== -->
        <section class="card">
            <h3>Assign Task</h3>

            <form id="add-task-form">
                <label>Employee</label>
                <select id="task-emp" required></select>

                <label>Title</label>
                <input type="text" id="task-title" required>

                <label>Description</label>
                <textarea id="task-desc"></textarea>

                <label>Due Date</label>
                <input type="date" id="task-due">

                <label>Status</label>
                <select id="task-status">
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="finished">Finished</option>
                </select>

                <button type="submit">Create Task</button>
            </form>
        </section>

        <!-- ===================== EDIT PANEL ===================== -->
        <section id="task-edit-panel" class="card" style="display:none;">
            <h3>Edit Task</h3>

            <input type="hidden" id="edit-task-id">

            <label>Title</label>
            <input type="text" id="edit-task-title">

            <label>Description</label>
            <textarea id="edit-task-desc"></textarea>

            <label>Due Date</label>
            <input type="date" id="edit-task-due">

            <label>Status</label>
            <select id="edit-task-status">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="finished">Finished</option>
            </select>

            <div style="margin-top:10px;">
                <button type="button" onclick="saveTaskEdit()">Save</button>
                <button type="button" onclick="cancelTaskEdit()">Cancel</button>
            </div>
        </section>

        <!-- ===================== KANBAN ===================== -->
        <section class="kanban-board">

            <div class="kanban-column">
                <h3>🟡 Pending</h3>
                <div id="col-pending" class="kanban-list"></div>
            </div>

            <div class="kanban-column">
                <h3>🔵 In Progress</h3>
                <div id="col-in-progress" class="kanban-list"></div>
            </div>

            <div class="kanban-column">
                <h3>🟢 Finished</h3>
                <div id="col-finished" class="kanban-list"></div>
            </div>

            <div class="kanban-column">
                <h3>🔴 Overdue</h3>
                <div id="col-overdue" class="kanban-list"></div>
            </div>

        </section>

    </main>

</body>
</html>
