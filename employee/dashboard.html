<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- 1. Supabase SDK (ONLY ONCE) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Global Supabase client -->
    <script src="../js/config.js"></script>

    <!-- Shared helpers (escaping, working-day maths) -->
    <script src="../js/utils.js" defer></script>

    <!-- Leave rules engine (balance, overlap, holidays) -->
    <script src="../js/leave-rules.js" defer></script>

    <!-- Role guard (RBAC) - must run before page logic -->
    <script src="../js/guard.js" defer></script>

    <!-- 3. Page logic -->
    <script src="../js/dashboard.js" defer></script>

    <!-- 4. Optional auth (logout, session checks) -->
    <script src="../js/auth.js" defer></script>

    <!-- Notifications (bell, realtime, approve/reject modal) -->
    <script src="../js/notifications.js" defer></script>

</head>

<body>

    <!-- SIDE NAV (if needed) -->
    <aside class="side-nav" id="sideNav">
        <div class="brand">Leaveable</div>

        <nav>
             <a href="dashboard.html" class="nav-item active">Dashboard</a>
            <a href="application.html" class="nav-item">Apply Leave</a>
            <a href="employee.html" class="nav-item">Employees</a>
            <a href="schedule.html" class="nav-item">Schedule</a>
            <a href="tasks.html" class="nav-item ">Tasks</a>
     

          <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </aside>

<main class="container">

    <div class="page-header">
        <h2>Dashboard Overview</h2>
        <p class="section-description">Real-time system analytics and workforce insights</p>
    </div>

    <!-- METRICS -->
    <section class="metrics-grid">

        <div class="metric-card blue">
            <h3>Total Employees</h3>
            <p id="total-employees">0</p>
        </div>

        <div class="metric-card orange">
            <h3>On Leave Today</h3>
            <p id="on-leave">0</p>
        </div>

        <div class="metric-card yellow">
            <h3>Pending Requests</h3>
            <p id="pending-requests">0</p>
        </div>

        <div class="metric-card green">
            <h3>Total Tasks</h3>
            <p id="total-tasks">0</p>
        </div>

    </section>


    <!-- LISTS -->
    <section class="lists-grid">

        <div class="list-card">
            <h3>My Leave Balance</h3>
            <ul id="my-balances"></ul>
        </div>

        <div class="list-card">
            <h3>Currently On Leave</h3>
            <ul id="on-leave-list"></ul>
        </div>

        <div class="list-card">
            <h3>Recent Leave Activity</h3>
            <ul id="recent-leave-list"></ul>
        </div>

    </section>

</main>

</body>
</html>
