<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Approvals</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Core -->
    <script src="../js/config.js" defer></script>

    <!-- Shared helpers (escaping, working-day maths) -->
    <script src="../js/utils.js" defer></script>

    <!-- Leave rules engine (balance, overlap, holidays) -->
    <script src="../js/leave-rules.js" defer></script>

    <!-- Role guard (RBAC) - must run before page logic -->
    <script src="../js/guard.js" defer></script>

    <!-- Page logic -->
    <script src="../js/approval.js" defer></script>

    <!-- Auth -->
    <script src="../js/auth.js" defer></script>

    <!-- Notifications (bell, realtime, approve/reject modal) -->
    <script src="../js/notifications.js" defer></script>

</head>

<body>

    <!-- SIDE NAV -->
    <aside class="side-nav" id="sideNav">
        <div class="brand">Leaveable</div>

        <nav>
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="application.html" class="nav-item">Apply Leave</a>
            <a href="approval.html" class="nav-item active">Approvals</a>
            <a href="employee.html" class="nav-item">Employees</a>
            <a href="schedule.html" class="nav-item">Schedule</a>
            <a href="tasks.html" class="nav-item">Tasks</a>

            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="container">

        <header class="page-header">
            <h2>Leave Approvals</h2>
            <p class="section-description">Approve or reject pending leave requests</p>
        </header>

        <!-- NOTIFICATIONS -->
        <div id="approval-notifs"></div>

        <!-- LOADING STATE -->
        <div id="approval-loading">
            Loading approvals...
        </div>

        <!-- APPROVAL TABLE -->
        <div id="approval-table"></div>

    </main>

</body>
</html>
