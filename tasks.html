<main class="container">

    <h2>Task Management</h2>

    <!-- ADD TASK FORM -->
    <section class="card">
        <h3>Assign Task</h3>

        <form id="add-task-form" onsubmit="handleAddTask(event)">
            <label>Employee</label>
            <select id="task-emp"></select>

            <label>Title</label>
            <input type="text" id="task-title" required>

            <label>Description</label>
            <textarea id="task-desc"></textarea>

            <label>Due Date</label>
            <input type="date" id="task-due">

            <label>Status</label>
            <select id="task-status">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="finished">Finished</option>
            </select>

            <button type="submit">Create Task</button>
        </form>
    </section>

<!-- EDIT TASK PANEL -->
<section id="task-edit-panel" class="card" style="display:none;">
    <h3>Edit Task</h3>

    <input type="hidden" id="edit-task-id">

    <label>Title</label>
    <input type="text" id="edit-task-title">

    <label>Description</label>
    <textarea id="edit-task-desc"></textarea>

    <label>Due Date</label>
    <input type="date" id="edit-task-due">

    <label>Status</label>
    <select id="edit-task-status">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="finished">Finished</option>
    </select>

    <div style="margin-top:10px;">
        <button onclick="saveTaskEdit()">Save</button>
        <button onclick="cancelTaskEdit()">Cancel</button>
    </div>
</section>




    <!-- KANBAN BOARD -->
    <section class="kanban-board">

        <div class="kanban-column">
            <h3>🟡 Pending</h3>
            <div id="col-pending" class="kanban-list"></div>
        </div>

        <div class="kanban-column">
            <h3>🔵 In Progress</h3>
            <div id="col-in-progress" class="kanban-list"></div>
        </div>

        <div class="kanban-column">
            <h3>🟢 Finished</h3>
            <div id="col-finished" class="kanban-list"></div>
        </div>

        <div class="kanban-column">
            <h3>🔴 Overdue</h3>
            <div id="col-overdue" class="kanban-list"></div>
        </div>

    </section>

</main>
